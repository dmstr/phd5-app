# file generated with AI assistance: Claude Code - 2026-07-31 16:40:00 UTC
#
# Override for /etc/nginx/conf.d/default.conf from the base image
# (yiisoftware/yii2-php). Identical to upstream except for one addition:
# HTTP_HOST is re-set to $http_host after including fastcgi_params.
#
# Background: Debian's nginx package patched fastcgi_params to send
# "fastcgi_param HTTP_HOST $host;" as a security workaround. $host does
# not contain the request port, so PHP/Yii generates absolute URLs
# (e.g. language redirects) without the mapped port — on dev stacks
# http://localhost:11280/ redirected to http://localhost/de.
server {
    charset utf-8;
    client_max_body_size 512M;
    server_name app;

    listen 80;
    listen 443 ssl http2 default_server;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    root        /app/web;
    index       index.php index.html index.htm;

    location / {
        # Redirect everything that isn't a real file to index.php
        try_files $uri $uri/ /index.php?$args;
    }

    # define suffixes for static files
    # set caching header and avoid processing of non-existing files by Yii
    location ~ \.(js|css|png|jpg|gif|swf|ico|pdf|mov|fla|zip|rar|svg|woff|woff2|eot|ttf|otf)$ {

        # set expire Header
        expires 6M;
        #add_header Cache-Control "public";
        add_header Last-Modified "";

        # keep logs clean
        log_not_found off;

        try_files $uri =404;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        # Preserve the client-supplied port in HTTP_HOST (Debian's
        # fastcgi_params sends port-less $host); last param wins in PHP
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        try_files $uri =404;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}
